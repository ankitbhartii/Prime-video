plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.framextv.tv'
    compileSdk 34

    defaultConfig {
        applicationId "xyz.framextv.tv"
        minSdk 22          // Fire TV Stick 2nd gen (Fire OS 5) and newer
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
